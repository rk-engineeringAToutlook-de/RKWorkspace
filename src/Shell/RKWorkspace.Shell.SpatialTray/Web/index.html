<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ablage im Raum</title>
    <link rel="stylesheet" href="/tray.css">
</head>
<body>
    <main class="room-shell">
        <section class="surface" aria-label="Ablage">
            <p class="eyebrow">Ablage im Raum</p>
            <h1 id="surface-name">Ablage</h1>
            <p id="surface-hint" class="surface-hint">bereit</p>

            <div id="thing" class="thing-card is-hidden" role="button" tabindex="0" aria-label="Digitales Ding nehmen">
                <span class="hand-zone" aria-hidden="true"></span>
                <span id="thing-name" class="thing-name">Rechnung.pdf</span>
                <span id="thing-hint" class="thing-hint">liegt hier</span>
            </div>

            <div id="empty-trace" class="empty-trace is-hidden">Ding wurde genommen</div>
            <p id="status" class="status">Ablage bereit</p>
        </section>

        <section class="room-map" aria-label="Raum">
            <div id="compass" class="compass-ring"></div>
        </section>

        <section class="actions" aria-label="Aktionen">
            <button id="place" class="place-button" type="button">Hier ablegen</button>
            <button id="cancel" class="cancel-button" type="button">Zuruecklegen</button>
        </section>
    </main>
    <script src="/tray.js"></script>
</body>
</html>
