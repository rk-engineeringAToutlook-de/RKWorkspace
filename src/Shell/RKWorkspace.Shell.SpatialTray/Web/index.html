<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="RK Ablage">
    <meta name="theme-color" content="#e7e4db">
    <title>Ablage im Raum</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/tray.css">
</head>
<body>
    <main class="surface-shell" aria-label="Ablage im Raum">
        <section class="surface" aria-label="Ablageflaeche">
            <h1 id="surface-name" class="surface-name">Ablage</h1>
            <div id="thing" class="thing-card is-hidden" role="button" tabindex="0" aria-label="Digitales Ding nehmen">
                <span class="hand-zone" aria-hidden="true"></span>
                <span id="thing-name" class="thing-name">Rechnung.pdf</span>
                <span id="thing-hint" class="thing-hint">liegt hier</span>
            </div>

            <div id="empty-trace" class="empty-trace is-hidden">Ding wurde genommen</div>
            <p id="status" class="sr-only" aria-live="polite"></p>
        </section>

        <section id="possibilities" class="possibilities" aria-label="Moeglichkeiten">
            <div id="compass" class="possibility-field"></div>
        </section>
    </main>
    <script src="/tray.js"></script>
</body>
</html>
